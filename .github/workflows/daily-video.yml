name: Daily Video Generation & YouTube Upload

on:
  schedule:
    # 7:55 AM Indian Standard Time (IST = UTC + 5:30) is 2:25 AM UTC (off-peak minute to avoid GitHub Actions queue delays)
    - cron: '25 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: explainroo-daily-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install ffmpeg (Linux)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install project dependencies
        run: npm ci || npm install

      - name: Install browser system dependencies
        run: npx playwright-core install-deps chromium || true

      - name: Setup speech models
        run: node bin/explainroo.js doctor --fetch

      - name: Generate daily video with Gemini and render MP4
        id: render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_MODEL: 'gemini-3.8-flash'
        run: npm run daily -- --next --render

      - name: Verify the rendered video
        env:
          PROJECT_DIR: ${{ steps.render.outputs.project_dir }}
        run: |
          test -n "$PROJECT_DIR"
          node bin/explainroo.js verify "$PROJECT_DIR"

      - name: Upload verified video to YouTube (Public)
        env:
          PROJECT_DIR: ${{ steps.render.outputs.project_dir }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: node scripts/upload-youtube.js "$PROJECT_DIR" --public

      - name: Commit updated topics queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topics.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: update daily topics queue [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Preserve video and captions for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainroo-video
          path: |
            videos/*/script.md
            videos/*/out/video.mp4
            videos/*/out/video.srt
            videos/*/out/video.cover.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up local video and credentials
        if: always()
        run: |
          echo "Deleting all video files and secrets..."
          rm -rf videos/ build/ client_secret.json youtube_token.json .cache/
          echo "Runner cleanup completed."
